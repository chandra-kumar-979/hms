<section class="login-wrap">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in to Hostel Management System</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="email" type="email" placeholder="you@example.com" />
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Login as</mat-label>
        <mat-select [(ngModel)]="role">
          <mat-option value="TENANT">Tenant</mat-option>
          <mat-option value="OWNER">Owner</mat-option>
          <mat-option value="ADMIN">Admin</mat-option>
        </mat-select>
      </mat-form-field>

      @if (error()) {
        <p class="error-line">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error() }}</span>
        </p>
      }
    </mat-card-content>

    <mat-card-actions align="end">
      <a mat-button routerLink="/register">New user? Register</a>
      <button mat-flat-button color="primary" [disabled]="loading() || !email" (click)="login()">
        @if (loading()) { <mat-spinner diameter="18"></mat-spinner> }
        <span>{{ loading() ? 'Signing in...' : 'Login' }}</span>
      </button>
    </mat-card-actions>
  </mat-card>
</section>

<div class="register-wrap">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
      <mat-card-subtitle>Join Hostel Management System</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Full Name</mat-label>
        <input matInput [(ngModel)]="name" placeholder="Your full name" required />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="email" type="email" placeholder="you@example.com" required />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Phone (optional)</mat-label>
        <input matInput [(ngModel)]="phone" placeholder="+91 XXXXX XXXXX" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Register as</mat-label>
        <mat-select [(ngModel)]="role">
          <mat-option value="TENANT">Tenant — looking for a hostel</mat-option>
          <mat-option value="OWNER">Owner — I manage a hostel</mat-option>
          <mat-option value="ADMIN">Admin — platform administrator</mat-option>
        </mat-select>
      </mat-form-field>
      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/login">Already have an account?</a>
      <button mat-flat-button color="primary" (click)="submit()" [disabled]="!name || !email">
        Create Account
      </button>
    </mat-card-actions>
  </mat-card>
</div>

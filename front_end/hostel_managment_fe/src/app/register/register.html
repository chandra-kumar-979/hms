<div class="register-wrap">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Create Tenant Account</mat-card-title>
      <mat-card-subtitle>Find and book your perfect stay</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Full Name</mat-label>
        <input matInput [(ngModel)]="name" placeholder="Your full name" required />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="email" type="email" placeholder="you@example.com" required />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Phone (optional)</mat-label>
        <input matInput [(ngModel)]="phone" placeholder="+91 XXXXX XXXXX" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="Min 6 characters" required />
        <button mat-icon-button matSuffix (click)="showPassword = !showPassword" type="button">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput [(ngModel)]="confirmPassword" [type]="showPassword ? 'text' : 'password'" placeholder="Repeat password" required />
      </mat-form-field>
      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }
      <p style="font-size:13px;color:#666;margin-top:8px;">
        Want to list a hostel? Contact admin to get an Owner account.
      </p>
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button routerLink="/auth/login">Already have an account?</a>
      <button mat-flat-button color="primary" (click)="submit()" [disabled]="!name || !email || !password">
        Create Account
      </button>
    </mat-card-actions>
  </mat-card>
</div>
